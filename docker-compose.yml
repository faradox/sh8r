x-all: &all
  ENVIRONMENT: ${SH8R_ENVIRONMENT:-development}
  LOG_LEVEL: ${SH8R_LOG_LEVEL:-INFO}
  DATABASE_URL: ${SH8R_DATABASE_URL:-postgresql://sh8r:sh8r@db:5432/sh8r}

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${SH8R_API_URL:-}
        VITE_WS_URL: ${SH8R_WS_URL:-}
    image: sh8r-frontend:latest
    container_name: sh8r-frontend
    restart: unless-stopped
    ports:
      # Loopback only: public traffic must pass the nginx auth rules.
      - "127.0.0.1:${SH8R_FRONTEND_PORT:-8080}:80"
    environment:
      - VITE_API_URL=${SH8R_API_URL:-}
      - VITE_WS_URL=${SH8R_WS_URL:-}
    profiles: ["prod"]

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: sh8r-frontend-dev:latest
    container_name: sh8r-frontend-dev
    restart: unless-stopped
    ports:
      - "${SH8R_FRONTEND_DEV_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=${SH8R_API_URL:-http://localhost:3001}
      - VITE_WS_URL=${SH8R_WS_URL:-ws://localhost:3001/ws}
      - BROWSER=none
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
    volumes:
      - ./frontend/src:/app/src:cached
      - ./frontend/index.html:/app/index.html:cached
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/package-lock.json:/app/package-lock.json:ro
      - /app/node_modules
    stdin_open: true
    tty: true
    profiles: ["dev"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        USER_ID: ${uid:-1000}
        GROUP_ID: ${gid:-1000}
    image: sh8r-backend:latest
    container_name: sh8r-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SH8R_BACKEND_PORT:-3001}:3001"
    environment:
      <<: [*all]
      PORT: 3001
    profiles: ["prod"]

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        USER_ID: ${uid:-1000}
        GROUP_ID: ${gid:-1000}
    image: sh8r-backend-dev:latest
    container_name: sh8r-backend-dev
    restart: unless-stopped
    ports:
      - "${SH8R_BACKEND_DEV_PORT:-3001}:3001"
    environment:
      <<: [*all]
      PORT: 3001
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json:ro
      - ./backend/package-lock.json:/app/package-lock.json:ro
      - /app/node_modules
    command: node --watch src/server.js
    profiles: ["dev"]

  # Bundled database for dev, and for prod via `--profile localdb` (or point
  # SH8R_DATABASE_URL at an existing Postgres instead).
  db:
    image: postgres:16-alpine
    container_name: sh8r-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SH8R_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${SH8R_POSTGRES_USER:-sh8r}
      POSTGRES_PASSWORD: ${SH8R_POSTGRES_PASSWORD:-sh8r}
      POSTGRES_DB: ${SH8R_POSTGRES_DB:-sh8r}
    volumes:
      - postgres-data-sh8r:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SH8R_POSTGRES_USER:-sh8r} -d ${SH8R_POSTGRES_DB:-sh8r}"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["dev", "localdb"]

volumes:
  postgres-data-sh8r:
    driver: local
